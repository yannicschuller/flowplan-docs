name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # GitHub's runners: free for public repositories, and code from pull
    # requests never reaches an own machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Accessibility and performance budgets (scripts/quality-check.mjs).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Quality budgets
        run: npm run quality
        env:
          QUALITY_OPTIONAL: "0"
