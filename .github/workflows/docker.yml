# Builds the image on every push to main and publishes it to the GitHub
# Container Registry, for Coolify:
#   ghcr.io/yannicschuller/flowplan-docs:latest       the latest commit on main
#   ghcr.io/yannicschuller/flowplan-docs:sha-abc1234  every build
# For linux/amd64 and linux/arm64, each built natively on GitHub's runners
# (ubuntu-latest and ubuntu-24.04-arm, free for public repositories) in
# parallel, then joined into one multi-platform image. Pull requests only
# build (no push). Every new :latest is rolled out on Coolify
# (COOLIFY_WEBHOOK, COOLIFY_TOKEN; see README).
name: Docker image

# Only after CI: an image of main is built when CI (typecheck, tests,
# build, the browser checks) has passed on exactly that commit, and before
# it is tagged :latest and rolled out it must start and serve its pages
# without Next.js's error page (the smoke test below). A red CI or a broken
# image never reaches the registry's :latest or Coolify, so the running site
# stays as it is.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  # By hand: only for a commit whose CI on main passed (checked in "gate").
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which commit, and whether it may become an image at all.
  gate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      short: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            workflow_run) sha="$RUN_SHA" ;;
            pull_request) sha="$PR_SHA" ;;
            *)
              sha="$GITHUB_SHA"
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq '.total_count')
              if [ "${passed:-0}" -lt 1 ]; then
                echo "::error::CI has not passed on $sha (a push to main) – no image. Wait for CI or fix it first."
                exit 1
              fi
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"

  # One native build per platform – no QEMU emulation. Each pushes its image
  # by digest only; "image" below tags them together.
  build:
    needs: gate
    # No image for Dependabot: its pull requests are tested by CI, and the
    # image is built after merging.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI checked (workflow_run runs on main's newest commit).
          ref: ${{ needs.gate.outputs.sha }}
          # The whole history: the build writes each page's last commit date
          # (scripts/last-modified.mjs) for the sitemap and the pages. No
          # token left in .git, which the image build copies.
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pull requests only build: nothing is published.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) }}
          build-args: |
            FLOWPLAN_SKIP_TYPECHECK=1
          # GitHub's Actions cache, one scope per platform, kept between runs.
          cache-from: type=gha,scope=image-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,scope=image-${{ steps.platform.outputs.pair }},mode=max
      # The new image must start and serve its pages before it can become
      # :latest: a page that renders Next.js's error page fails the run.
      - name: Smoke test the image
        if: github.event_name != 'pull_request' && matrix.platform == 'linux/amd64'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          PAGES: "/ /en /en/installation /installation"
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          for i in $(seq 1 45); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health && break; sleep 2; done
          fail=0
          for path in $PAGES; do
            status=$(curl -sSL --max-time 30 -o "$RUNNER_TEMP/page.html" -w '%{http_code}' "http://127.0.0.1:3000$path" || echo 000)
            if [ "$status" != 200 ] || grep -q '__next_error__' "$RUNNER_TEMP/page.html"; then
              echo "::error::$path answered $status or rendered Next.js's error page"
              fail=1
            else
              echo "$path: $status"
            fi
          done
          [ "$fail" = 0 ] || docker logs smoke 2>&1 | tail -60
          docker rm -f smoke > /dev/null
          exit $fail
      - name: Remember the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins both platform images under the tags.
  image:
    needs: [gate, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ needs.gate.outputs.short }}
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:sha-${{ needs.gate.outputs.short }}"

  # Rolls out the new :latest image on Coolify, never for pull requests.
  # Coolify's API must accept GitHub's runners (Settings → Advanced → API
  # access: allowed IPs); the token still guards it. Without the secrets the
  # step does nothing.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy on Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then echo "No Coolify secrets: nothing to deploy."; exit 0; fi
          # Coolify's answer explains a refusal (e.g. a missing permission).
          status=$(curl -sS --retry 3 --max-time 60 -o "$RUNNER_TEMP/coolify.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          echo "Coolify answered $status: $(head -c 500 "$RUNNER_TEMP/coolify.json")"
          if [ "$status" -ge 300 ]; then
            echo "::error::Coolify did not deploy ($status). 401/403: the API token needs the “deploy” permission and the team of the resource; check Settings → Advanced → API access and its allowed IPs."
            exit 1
          fi
