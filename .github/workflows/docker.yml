# Builds the image on every push to main and publishes it to the GitHub
# Container Registry, for Coolify:
#   ghcr.io/yannicschuller/flowplan-docs:latest       the latest commit on main
#   ghcr.io/yannicschuller/flowplan-docs:sha-abc1234  every build
# Pull requests only build (no push). Every new :latest is rolled out on
# Coolify (COOLIFY_WEBHOOK, COOLIFY_TOKEN; see README).
name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # No image for Dependabot: its pull requests are tested by CI, and the
    # image is built after merging, on the own runner.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    # Own runner (label self-hosted) for this repository's own work. Dependabot
    # and pull requests from forks run on GitHub's runners instead: their code
    # never reaches the self-hosted machine.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository))) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests only build (nothing is published): one architecture.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FLOWPLAN_SKIP_TYPECHECK=1
          # Cache in the registry: fast from the self-hosted runner, kept
          # between runs. Pull requests (also Dependabot, without registry
          # write access) use GitHub's cache.
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
            type=gha
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', github.repository) || 'type=gha,mode=max' }}
      # Rolls out the new :latest image on Coolify. Without the secrets (forks)
      # the step does nothing.
      - name: Deploy on Coolify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then echo "No Coolify secrets: nothing to deploy."; exit 0; fi
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
