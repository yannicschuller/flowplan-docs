name: Site problem
description: The documentation site itself is broken – layout, search, dark mode, a page that does not load
labels: ["bug"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-docs/issues?q=is%3Aissue).
          required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: "https://docs.flowplan.org/en/…"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Windows 11 · Safari on iPhone"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
