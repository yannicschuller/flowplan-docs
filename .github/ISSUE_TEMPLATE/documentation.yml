name: Documentation issue
description: Something on docs.flowplan.org is missing, wrong or unclear
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping to improve the docs! Small fixes can go straight to a pull request – every page has an "Edit on GitHub" link at the bottom.
        Bugs in Flowplan itself belong in the [main Flowplan repository](https://github.com/yannicschuller/flowplan/issues/new/choose).
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-docs/issues?q=is%3Aissue) and this has not been reported yet.
          required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: "https://docs.flowplan.org/en/installation#docker-compose"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the page
      options:
        - English
        - German
        - Both
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Something is wrong or outdated
        - Something is missing
        - Something is hard to understand
        - Typo, broken link or image
        - Search or navigation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Quote the passage if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: How should it read, or what should the page explain?
